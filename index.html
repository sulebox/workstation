<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SULE WORKSTATION BOX</title>
    <meta name="description" content="SULEBOX のものづくり用ワークステーション。単位変換・ネジ・はめあい・電卓・翻訳・サーボ・回路計算。">
    <meta name="theme-color" content="#3B2420">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
    <link rel="preload" as="image" href="assets/img/city-day.webp" type="image/webp" media="(min-width: 901px)">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/core.js"></script>
    <script src="assets/js/expr.js" defer></script>
    <style>
        body.home {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #2A1B17;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        /* --- 街の背景 ------------------------------------------------
           昼/夜の写真をクロスフェード。ネオン部分は city-neon.webp を
           マスクにしてテーマ色 (--accent) で塗るので、テーマを変えると
           看板や窓の光もその色になる。夜はスクリーン合成で発光させる。 */
        .city { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .city__layer {
            position: absolute;
            inset: -2%;
            background-size: cover;
            background-position: center 38%;
            background-repeat: no-repeat;
            transition: opacity 2s var(--ease), filter 2s var(--ease);
            animation: drift 40s ease-in-out infinite alternate;
        }
        .city__day { background-image: url("assets/img/city-day.webp"); }
        .city__night { background-image: url("assets/img/city-night.webp"); opacity: 0; }
        .city__neon {
            --neon: url("assets/img/city-neon.webp");
            background: var(--accent);
            -webkit-mask: var(--neon) center 38% / cover no-repeat;
            mask: var(--neon) center 38% / cover no-repeat;
            mix-blend-mode: color;
            opacity: .95;
            transition: opacity 2s var(--ease), background-color .6s var(--ease);
        }
        .city__shade {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(120% 70% at 50% 110%, rgba(20, 12, 10, .55), transparent 60%),
                linear-gradient(180deg, rgba(20, 12, 10, .18), transparent 22%);
            transition: background-color 2s var(--ease);
        }
        @media (max-width: 900px) {
            .city__day { background-image: url("assets/img/city-day-1280.webp"); }
            .city__night { background-image: url("assets/img/city-night-1280.webp"); }
            .city__neon { --neon: url("assets/img/city-neon-1280.webp"); }
        }
        /* 昼のチョコミントは元の絵のままでOK */
        html[data-mode="day"][data-theme="mint"] .city__neon { opacity: 0; }
        /* バナナ・ストロベリーは街を少し落ち着かせて、光る部分をテーマ色に */
        html[data-theme="banana"] .city__day, html[data-theme="strawberry"] .city__day { filter: saturate(.5); }
        html[data-theme="banana"] .city__night, html[data-theme="strawberry"] .city__night { filter: saturate(.35); }
        /* 夜: 街を暗くしてネオンを発光 */
        html[data-mode="night"] .city__night { opacity: 1; }
        html[data-mode="night"] .city__shade { background-color: rgba(10, 5, 4, .7); }
        html[data-mode="night"] .city__neon {
            mix-blend-mode: screen;
            opacity: 1;
            animation: drift 40s ease-in-out infinite alternate, flicker 9s steps(1) infinite;
        }

        @keyframes drift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.035) translate3d(-.6%, -.4%, 0); } }
        @keyframes flicker { 0%, 100% { opacity: 1; } 61% { opacity: .78; } 62% { opacity: 1; } 63% { opacity: .88; } 64% { opacity: 1; } }

        /* --- 上部: 時計と設定 --- */
        .home-top {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        }
        .glass {
            background: color-mix(in srgb, var(--surface) 70%, transparent);
            -webkit-backdrop-filter: saturate(1.5) blur(16px);
            backdrop-filter: saturate(1.5) blur(16px);
            border: 1px solid color-mix(in srgb, var(--surface) 60%, transparent);
            box-shadow: 0 10px 30px -12px rgba(20, 12, 10, .45);
        }
        html[data-mode="night"] .glass {
            background: color-mix(in srgb, var(--surface) 72%, transparent);
            border-color: rgba(255, 255, 255, .08);
        }
        .clock {
            padding: 10px 16px 10px 14px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .clock__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft), 0 0 14px var(--glow);
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent, 0 0 18px var(--glow); } }
        .clock__time { font-family: var(--font-mono); font-weight: 700; font-size: 22px; letter-spacing: -.02em; line-height: 1; }
        .clock__time span { animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: .25; } }
        .clock__date { font-family: var(--font-ui); font-weight: 700; font-size: 12px; color: var(--ink-2); line-height: 1.3; }
        .home-top__tools { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 18px; }
        .home-top__tools .swatches, .home-top__tools .icon-btn, .home-top__tools .palette-btn { border-color: transparent; background: transparent; }

        /* --- ドック --- */
        .home-main {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 16px max(16px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .dock {
            width: min(860px, 100%);
            border-radius: 30px;
            padding: 18px 20px 14px;
        }
        .dock__head { display: flex; align-items: baseline; gap: 12px; padding: 0 6px 12px; }
        .greet { font-family: var(--font-ui); font-weight: 900; font-size: clamp(18px, 2.4vw, 22px); letter-spacing: .02em; }
        .greet b { color: var(--accent-ink); font-weight: 900; }
        .dock__hint { margin-left: auto; color: var(--ink-2); font-size: 12px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }

        .tiles {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px 4px 8px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--ink);
            transition: background-color .25s;
            animation: rise .6s var(--ease) both;
            animation-delay: calc(var(--i) * 45ms + 120ms);
        }
        .tile:hover, .tile:focus-visible { background: color-mix(in srgb, var(--surface) 55%, transparent); }
        .tile__icon {
            width: 66px;
            height: 66px;
            border-radius: 20px;
            background: linear-gradient(180deg, #5A3B33 0%, #3B2420 55%, #2E1B17 100%);
            color: var(--accent);
            display: grid;
            place-items: center;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .18),
                inset 0 -4px 0 rgba(0, 0, 0, .28),
                0 10px 18px -10px rgba(20, 12, 10, .7);
            transition: transform .35s var(--spring), box-shadow .3s;
        }
        .tile__icon svg { width: 30px; height: 30px; stroke-width: 1.9; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent)); transition: transform .4s var(--spring); }
        .tile:hover .tile__icon, .tile:focus-visible .tile__icon {
            transform: translateY(-5px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .18),
                inset 0 -4px 0 rgba(0, 0, 0, .28),
                0 0 0 3px var(--accent-soft),
                0 16px 26px -10px var(--glow);
        }
        .tile:hover .tile__icon svg { transform: rotate(-8deg) scale(1.06); }
        .tile:active .tile__icon { transform: translateY(-1px) scale(.96); }
        .tile__name { font-family: var(--font-ui); font-weight: 900; font-size: 13.5px; line-height: 1.1; }
        .tile__desc { font-size: 10.5px; color: var(--ink-2); line-height: 1.3; text-align: center; min-height: 2.6em; }
        .tile__key {
            position: absolute;
            top: 4px;
            right: 8px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-3);
        }

        @media (max-width: 760px) {
            .dock { padding: 14px 10px 10px; border-radius: 26px; }
            .tiles { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 4px; gap: 0; }
            .tile { flex: 0 0 25%; }
            .tile__desc, .tile__key, .dock__hint { display: none; }
            .tile__icon { width: 58px; height: 58px; border-radius: 18px; }
            .tile__icon svg { width: 26px; height: 26px; }
            .clock__time { font-size: 18px; }
            .clock { padding: 8px 12px; }
            .home-top__tools .palette-btn { display: none; }
        }
        @media (max-height: 560px) and (orientation: landscape) {
            .tile__desc { display: none; }
            .dock__head { padding-bottom: 6px; }
        }
    </style>
</head>
<body class="home">
    <div class="city" aria-hidden="true">
        <div class="city__layer city__day"></div>
        <div class="city__layer city__night"></div>
        <div class="city__shade"></div>
        <div class="city__layer city__neon"></div>
    </div>

    <h1 class="sr-only">SULE WORKSTATION BOX</h1>

    <header class="home-top">
        <div class="clock glass" aria-live="off">
            <span class="clock__dot" aria-hidden="true"></span>
            <div>
                <div class="clock__time" id="clock-time">--:--</div>
                <div class="clock__date" id="clock-date"></div>
            </div>
        </div>
        <div class="home-top__tools glass">
            <button type="button" class="palette-btn" id="open-palette" aria-label="ツール検索・クイック計算">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg>
                <span class="palette-btn__label">検索・計算</span><span class="kbd" id="palette-kbd">⌘ K</span>
            </button>
            <div data-swb-controls style="display:flex;gap:6px;align-items:center"></div>
        </div>
    </header>

    <main class="home-main">
        <section class="dock glass" aria-label="ツール">
            <div class="dock__head">
                <p class="greet" id="greet">ようこそ</p>
                <p class="dock__hint"><span class="kbd">1</span>〜<span class="kbd">7</span> でひらく</p>
            </div>
            <nav class="tiles" id="tiles"></nav>
        </section>
    </main>

    <script>
        (function () {
            const tiles = document.getElementById('tiles');
            tiles.innerHTML = SWB.TOOLS.map((t, i) =>
                '<a class="tile" href="' + t.href + '" style="--i:' + i + '" aria-keyshortcuts="' + (i + 1) + '">' +
                    '<span class="tile__icon">' + SWB.icon(t.icon) + '</span>' +
                    '<span class="tile__name">' + t.name + '</span>' +
                    '<span class="tile__desc">' + SWB.escape(t.desc) + '</span>' +
                    '<span class="tile__key" aria-hidden="true">' + (i + 1) + '</span>' +
                '</a>'
            ).join('');

            // 数字キーでツールを開く
            document.addEventListener('keydown', e => {
                if (e.metaKey || e.ctrlKey || e.altKey || SWB.isTyping(document.activeElement) || SWB.palette.isOpen()) return;
                const n = Number(e.key);
                if (n >= 1 && n <= SWB.TOOLS.length) location.href = SWB.TOOLS[n - 1].href;
            });

            document.getElementById('open-palette').addEventListener('click', () => SWB.palette.open());
            if (!SWB.isMac) document.getElementById('palette-kbd').textContent = 'Ctrl K';

            // 時計とあいさつ
            const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
            const timeEl = document.getElementById('clock-time');
            const dateEl = document.getElementById('clock-date');
            const greetEl = document.getElementById('greet');
            function greeting(h) {
                if (h >= 5 && h < 11) return 'おはよう';
                if (h >= 11 && h < 17) return 'こんにちは';
                if (h >= 17 && h < 23) return 'こんばんは';
                return '夜ふかし中？';
            }
            function tick() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                timeEl.innerHTML = hh + '<span>:</span>' + mm;
                dateEl.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日（' + WEEK[now.getDay()] + '）';
                greetEl.innerHTML = greeting(now.getHours()) + '、<b>SULE</b>。今日はなにつくる？';
            }
            tick();
            setInterval(tick, 5000);
        })();
    </script>
</body>
</html>
